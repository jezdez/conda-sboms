[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "conda-sboms"
description = "Generate software bills of materials from conda environments"
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # conda >=26.3 is required but is not distributed on PyPI.
  "cyclonedx-python-lib>=11.12,<12",
  "packageurl-python>=0.16",
]
dynamic = ["version"]

[project.urls]
documentation = "https://jezdez.github.io/conda-sboms/"
repository = "https://github.com/jezdez/conda-sboms"

[project.entry-points.conda]
conda-sboms = "conda_sboms.plugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "conda_sboms/_version.py"

[tool.pytest.ini_options]
addopts = "-ra -v"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = ["conda_sboms/_version.py"]

[tool.ruff.lint]
flake8-type-checking = { exempt-modules = [], strict = true }
select = ["E", "F", "FA", "I", "ISC", "RUF100", "T10", "TCH", "UP", "W"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.10"
conda = ">=26.3"
cyclonedx-python-lib = ">=11.12,<12"
packageurl-python = ">=0.16"

[tool.pixi.pypi-dependencies]
conda-sboms = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.9"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.74"

[tool.pixi.feature.build.tasks]
build = "rattler-build build --recipe recipe/recipe.yaml"

[tool.pixi.feature.docs.dependencies]
conda-sphinx-theme = ">=0.2"
myst-parser = ">=3.0"
sphinx = ">=7.0"
sphinx-design = ">=0.6"

[tool.pixi.feature.docs.tasks]
docs = { cmd = "sphinx-build -b dirhtml docs docs/_build/dirhtml", description = "Build documentation" }

[tool.pixi.feature.test.dependencies]
jsonschema = ">=4.0"
pytest = ">=8.0"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
dev = { features = ["dev", "test"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }
test-py310 = { features = ["dev", "test", "py310"], solve-group = "test-py310" }
test-py314 = { features = ["dev", "test", "py314"], solve-group = "test-py314" }

[tool.pixi.tasks]
format = { cmd = "ruff format conda_sboms tests", description = "Format source and tests" }
format-check = { cmd = "ruff format --check conda_sboms tests", description = "Check formatting" }
lint = { cmd = "ruff check conda_sboms tests", description = "Check source and tests" }
test = { cmd = "pytest", description = "Run tests" }

[tool.pixi.tasks.check]
depends-on = ["lint", "format-check", "test"]
description = "Run all checks"
