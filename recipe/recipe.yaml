schema_version: 1

context:
  version: ${{ env.get("SETUPTOOLS_SCM_PRETEND_VERSION", default="0.0.0dev0") }}
  python_min: "3.10"

package:
  name: conda-sboms
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script:
    - export SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27
    - hatch-vcs >=0.4
    - pip
  run:
    - python >=${{ python_min }}
    - conda >=26.3
    - cyclonedx-python-lib >=11.12,<12
    - packageurl-python >=0.16

tests:
  - python:
      imports:
        - conda_sboms
      pip_check: true
  - script:
      - python -c "import subprocess; assert 'cyclonedx-json' in subprocess.check_output(['conda', 'export', '--help'], text=True)"

about:
  summary: Generate software bills of materials from conda environments
  description: |
    conda-sboms provides software bill of materials exporters through conda's
    environment exporter plugin hook. Its first exporter emits CycloneDX 1.7
    JSON from resolved conda package records.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/conda-incubator/conda-sboms

extra:
  recipe-maintainers:
    - jezdez
